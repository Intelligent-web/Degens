<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHANTOM TRADER</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#0e1411;--card:#17201b;--tx:#e6f0e9;--mu:#8aa093;--ac:#3ddc84;--rd:#ff5a5a}
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:var(--bg);color:var(--tx);padding:16px;max-width:900px;margin:auto}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:14px}
input{width:100%;padding:10px;border-radius:8px;border:1px solid #2b3a31;background:#0e1411;color:var(--tx);margin:4px 0 10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
button{padding:10px 18px;border:0;border-radius:8px;font-weight:700;cursor:pointer;background:var(--ac);color:#06210f;margin-right:8px}
button.red{background:var(--rd);color:#fff}button.gr{background:#2b3a31;color:var(--tx)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid #2b3a31;text-align:left}
.mu{color:var(--mu)}.w{overflow-x:auto}#msg{color:var(--mu);margin-top:8px}
</style></head><body>
<h2>Phantom AI bot Traders</h2>
<div class="card" id="login"><b>Admin login</b><input id="em" placeholder="email"><input id="pw" type="password" placeholder="password"><button onclick="login()">Sign in</button></div>
<div id="app" style="display:none">
<div style="text-align:right;margin-bottom:8px"><button class="gr" style="margin:0" onclick="logout()">Log out</button></div>
<div class="card"><b>Target</b>
<label class="mu">Contract address (CA)</label><input id="mint">
<div class="row"><div><label class="mu">Buy per bot (SOL)</label><input id="buy_sol" type="number" step="0.01"></div>
<div><label class="mu">Take-profit min (x)</label><input id="tp_min" type="number" step="0.1"></div>
<div><label class="mu">Take-profit max (x)</label><input id="tp_max" type="number" step="0.1"></div>
<div><label class="mu">Slippage (bps)</label><input id="slippage_bps" type="number"></div>
<div><label class="mu">Stop-loss (x, 0 = off)</label><input id="stop_loss" type="number" step="0.05"></div>
<div><label class="mu">Max hold (minutes, 0 = off)</label><input id="max_hold_min" type="number"></div></div>
<button class="gr" onclick="act('save')">Save CA</button><button onclick="act('run')">Run</button>
<button class="gr" onclick="act('stop')">Stop</button><button class="red" onclick="if(confirm('Sell ALL bot holdings now?'))act('sellall')">Sell All</button>
<div id="msg"></div></div>
<div class="card"><b>Buy amount per bot (SOL)</b> <span class="mu">— blank = use the default above, 0 = that bot sits out</span><div class="row" id="amts" style="margin-top:10px"></div><button class="gr" onclick="saveAmts()">Save amounts</button></div>
<div class="card w"><b>Bots</b> <span class="mu">— fund each wallet with SOL (buy amount + fees)</span>
<table><thead><tr><th>#</th><th>Wallet</th><th>Status</th><th>Entry SOL</th><th>Target</th><th>Note</th></tr></thead><tbody id="rows"></tbody></table>
<button class="gr" style="margin-top:12px" onclick="act('setup')">Create 10 bot wallets</button>
<div style="margin-top:14px"><label class="mu">Withdraw leftover SOL to (your wallet address)</label><input id="withdraw_to" placeholder="your Phantom address">
<button class="gr" onclick="if(confirm('Send leftover SOL from all idle/sold bots to this address?'))act('withdraw')">Withdraw</button></div></div>
</div>
<script>
const SUPABASE_URL="https://ihnmjdeqgbbobqxdosoa.supabase.co",SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlobm1qZGVxZ2Jib2JxeGRvc29hIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3NjgxNDksImV4cCI6MjEwODM0NDE0OX0.Di_TYD0EuuqTc_s_xgn2SIu1QnBkin1xOw6Qu3cz6Pw";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=i=>document.getElementById(i),F=["mint","buy_sol","tp_min","tp_max","slippage_bps","stop_loss","max_hold_min"];
async function login(){const{error}=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});if(error)return alert(error.message);start()}
async function start(){const{data:{session}}=await sb.auth.getSession();if(!session)return;
$("login").style.display="none";$("app").style.display="block";
const{data:c}=await sb.from("bot_config").select("*").single();if(c)F.forEach(f=>$(f).value=c[f]??"");buildAmts();refresh();setInterval(refresh,4000)}
async function refresh(){const{data}=await sb.from("bots").select("*").order("id");
$("rows").innerHTML=(data||[]).map(b=>`<tr><td>${b.id}</td><td title="${b.pubkey}">${b.pubkey.slice(0,4)}…${b.pubkey.slice(-4)}</td><td>${b.status}</td><td>${b.sol_in||"-"}</td><td>${b.tp?(+b.tp).toFixed(2)+"x":"-"}</td><td class="mu">${b.note||""}</td></tr>`).join("")}
async function act(action){$("msg").textContent=action+"…";const config={};F.forEach(f=>config[f]=$(f).value);config.withdraw_to=$("withdraw_to").value;
const{data,error}=await sb.functions.invoke("bot",{body:{action,config}});
$("msg").textContent=error?("Error: "+error.message):(data&&data.error)?("Error: "+data.error):(action+" done");refresh();if(action==="setup")buildAmts()}
async function logout(){await sb.auth.signOut();location.reload()}
let botIds=[];
async function buildAmts(){const{data}=await sb.from("bots").select("id,buy_sol").order("id");botIds=(data||[]).map(b=>b.id);
$("amts").innerHTML=(data||[]).map(b=>`<div><label class="mu">Bot ${b.id}</label><input id="amt${b.id}" type="number" step="0.0001" min="0" placeholder="default" value="${b.buy_sol??""}"></div>`).join("")}
async function saveAmts(){$("msg").textContent="saving amounts…";
const{data,error}=await sb.functions.invoke("bot",{body:{action:"amounts",config:{amounts:botIds.map(id=>$("amt"+id).value)}}});
$("msg").textContent=error?("Error: "+error.message):(data&&data.error)?("Error: "+data.error):"amounts saved"}
start();
</script></body></html>
